version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { dev-dependencies: { dependency-type: development } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
